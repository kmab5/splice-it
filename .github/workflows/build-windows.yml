name: Build Windows Installers

# Cross-compiling a Tauri app from Linux to Windows is impractical (the MSI and
# NSIS bundlers need Windows tooling), so the build runs on a Windows runner
# instead. Trigger it by hand from the Actions tab, or push a v* tag to build
# and publish a GitHub Release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# Needed so the release job can create a release and upload assets.
permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Caches src-tauri/target. The first run compiles ~500 crates and takes
      # roughly 10-15 minutes; later runs are usually 2-4.
      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Type-check frontend
        run: npm run lint

      - name: Build Tauri app
        run: npm run tauri:build

      # Collect everything into one folder so the release step has a simple
      # glob and the artifact names stay predictable.
      - name: Stage release files
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          echo "APP_VERSION=$version" >> $env:GITHUB_ENV
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null

          $bundle = "src-tauri/target/release/bundle"
          Get-ChildItem -Path "$bundle/msi"  -Filter *.msi -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "dist-release/SpliceIt_${version}_x64.msi" }
          Get-ChildItem -Path "$bundle/nsis" -Filter *-setup.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item $_.FullName "dist-release/SpliceIt_${version}_x64-setup.exe" }

          # Standalone executable, no installer.
          if (Test-Path "src-tauri/target/release/splice-it.exe") {
            Copy-Item "src-tauri/target/release/splice-it.exe" `
                      "dist-release/SpliceIt_${version}_portable.exe"
          }

          Get-ChildItem dist-release | Format-Table Name, Length

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: splice-it-windows-${{ env.APP_VERSION }}
          path: dist-release/*
          if-no-files-found: error

      # Only on a v* tag. A manual run just leaves the artifacts above.
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Splice It ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*
          body: |
            ## Splice It ${{ github.ref_name }}

            ### Downloads

            | File | Use it if |
            |---|---|
            | `SpliceIt_${{ env.APP_VERSION }}_x64-setup.exe` | You want the usual installer (recommended) |
            | `SpliceIt_${{ env.APP_VERSION }}_x64.msi` | You are deploying via Group Policy or Intune |
            | `SpliceIt_${{ env.APP_VERSION }}_portable.exe` | You would rather not install anything |

            Windows 11 and current Windows 10 already include the WebView2
            runtime, so nothing else is needed.

            ### A note on the SmartScreen warning

            These builds are not code-signed yet, so Windows will show
            "Windows protected your PC" on first run. Choose **More info** then
            **Run anyway**. Signing is planned.
