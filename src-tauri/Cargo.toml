[package]
name = "splice-it"
version = "0.1.0"
description = "Splice It - Modern High-Performance Desktop Audio Workspace"
authors = ["Splice It Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
symphonia = { version = "0.5.4", features = ["all"] }
hound = "3.5.1"
lofty = "0.21.1"
cpal = "0.15.3"
biquad = "0.4.2"
base64 = "0.22.1"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
thiserror = "1.0.64"
log = "0.4.22"
env_logger = "0.11.5"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
